spring:
  application:
    name: capitall
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/capitalldb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    com.capitall: INFO

capitall:
  encryption:
    secret-key: ${CAPITALL_ENCRYPTION_KEY:qV_sUpEr_sEcReT_kEy_fOr_aEs_256!}
  security:
    default-admin-password: ${CAPITALL_DEFAULT_ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:noreply@capitall.example}
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
