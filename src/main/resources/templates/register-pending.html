<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Sprawdź skrzynkę')}"></head>
<body class="bg-qv-bg font-sans text-qv-text antialiased min-h-screen flex items-center justify-center p-6 transition-colors-all">
    <div class="absolute top-6 right-6 z-50">
        <div th:replace="~{fragments/theme :: toggle}"></div>
    </div>

    <div class="max-w-md w-full bg-qv-surface border border-qv-border rounded-2xl shadow-qv-lg p-8 text-center transition-colors-all">
        <div class="w-14 h-14 rounded-full bg-qv-accent/20 border border-qv-accent/30 mx-auto mb-5 flex items-center justify-center">
            <svg class="w-7 h-7 text-qv-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-qv-text mb-3">Sprawdź swoją skrzynkę</h1>
        <p class="text-sm text-qv-muted mb-2">Wysłaliśmy link aktywacyjny na adres:</p>
        <p class="text-sm font-semibold text-qv-accent mb-6" th:text="${email}">user@example.com</p>
        <p class="text-xs text-qv-muted mb-6">Link jest ważny 24 godziny. Po kliknięciu skonfigurujesz Microsoft Authenticator (weryfikacja dwuetapowa).</p>
        <a href="/login" class="block w-full py-3 bg-qv-accent hover:bg-qv-accent-hover text-white font-bold rounded-lg transition-colors">Powrót do logowania</a>
    </div>
</body>
</html>
