<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Weryfikacja 2FA')}"></head>
<body class="bg-qv-bg font-sans text-qv-text antialiased min-h-screen flex items-center justify-center p-6 transition-colors-all">
    <div class="absolute top-6 right-6 z-50">
        <div th:replace="~{fragments/theme :: toggle}"></div>
    </div>

    <div class="max-w-md w-full bg-qv-surface border border-qv-border rounded-2xl shadow-qv-lg p-8 transition-colors-all">
        <div class="w-14 h-14 rounded-full bg-qv-accent/20 border border-qv-accent/30 mx-auto mb-5 flex items-center justify-center">
            <svg class="w-7 h-7 text-qv-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-1.66-1.34-3-3-3S6 9.34 6 11s1.34 3 3 3 3-1.34 3-3zm0 0V7a4 4 0 118 0v4m-9 4h10a2 2 0 012 2v3a2 2 0 01-2 2H7a2 2 0 01-2-2v-3a2 2 0 012-2z"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-center text-qv-text mb-2">Weryfikacja dwuetapowa</h1>
        <p class="text-sm text-qv-muted text-center mb-6">
            Wpisz 6-cyfrowy kod z aplikacji Microsoft Authenticator dla konta
            <span class="text-qv-accent font-semibold" th:text="${username}">user</span>.
        </p>

        <div th:if="${error}" class="mb-4 p-3 bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 text-red-700 dark:text-red-400 text-sm rounded-lg text-center transition-colors-all" th:text="${error}"></div>

        <form method="POST" action="/login/2fa" class="space-y-4">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <div>
                <label class="block text-sm font-semibold text-qv-text mb-2">Kod weryfikacyjny</label>
                <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]{6}" maxlength="6" required autofocus
                       class="w-full bg-qv-surface-2 border border-qv-border rounded-lg px-4 py-3 text-center text-2xl tracking-widest font-mono text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none transition-all"
                       placeholder="000000" />
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-qv-accent to-blue-500 hover:opacity-90 text-white font-bold rounded-lg shadow-qv transition-all">
                Zaloguj
            </button>
        </form>
        <div class="mt-5 flex justify-between text-xs">
            <a href="/login/2fa/help" class="text-qv-muted hover:text-qv-accent transition-colors">Nie masz dostępu do aplikacji?</a>
            <a href="/logout" class="text-qv-muted hover:text-qv-accent transition-colors">Anuluj</a>
        </div>
    </div>
</body>
</html>
