<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Capitall - Weryfikacja 2FA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#0b1120;color:#f8fafc;font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-8">
        <div class="w-14 h-14 rounded-full bg-violet-500/20 border border-violet-500/30 mx-auto mb-5 flex items-center justify-center">
            <svg class="w-7 h-7 text-violet-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-1.66-1.34-3-3-3S6 9.34 6 11s1.34 3 3 3 3-1.34 3-3zm0 0V7a4 4 0 118 0v4m-9 4h10a2 2 0 012 2v3a2 2 0 01-2 2H7a2 2 0 01-2-2v-3a2 2 0 012-2z"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-center mb-2">Weryfikacja dwuetapowa</h1>
        <p class="text-sm text-slate-400 text-center mb-6">
            Wpisz 6-cyfrowy kod z aplikacji Microsoft Authenticator dla konta
            <span class="text-violet-400 font-semibold" th:text="${username}">user</span>.
        </p>

        <div th:if="${error}" class="mb-4 p-3 bg-red-900/30 border border-red-800 text-red-300 text-sm rounded-lg text-center" th:text="${error}"></div>

        <form method="POST" action="/login/2fa" class="space-y-4">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <div>
                <label class="block text-sm font-semibold mb-2">Kod weryfikacyjny</label>
                <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]{6}" maxlength="6" required autofocus
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-center text-2xl tracking-widest font-mono focus:ring-2 focus:ring-violet-500 focus:border-violet-500 focus:outline-none"
                       placeholder="000000" />
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-violet-500 to-blue-500 hover:opacity-90 text-white font-bold rounded-lg">
                Zaloguj
            </button>
        </form>
        <div class="mt-5 flex justify-between text-xs">
            <a href="/login/2fa/help" class="text-slate-400 hover:text-violet-400">Nie masz dostępu do aplikacji?</a>
            <a href="/logout" class="text-slate-400 hover:text-violet-400">Anuluj</a>
        </div>
    </div>
</body>
</html>
