<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Logowanie')}"></head>
<head>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="bg-qv-bg font-sans text-qv-text antialiased min-h-screen flex items-center justify-center p-6 transition-colors-all relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-qv-accent/10 to-transparent -z-10 pointer-events-none transition-colors-all"></div>
    <div class="absolute top-1/4 -right-32 w-96 h-96 bg-qv-accent/5 rounded-full blur-3xl -z-10 pointer-events-none transition-colors-all"></div>
    <div class="absolute bottom-1/4 -left-32 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl -z-10 pointer-events-none transition-colors-all"></div>

    <div class="absolute top-6 right-6 z-50">
        <div th:replace="~{fragments/theme :: toggle}"></div>
    </div>

    <div class="w-full max-w-md animate-fade-in">
        <div class="text-center mb-8">
            <a href="/" class="inline-block transition-transform hover:scale-105">
                <div class="w-16 h-16 rounded-full bg-qv-surface border border-qv-border mx-auto flex items-center justify-center mb-4 shadow-qv transition-colors-all">
                    <img src="/images/logo.png" alt="Capitall Logo" class="w-8 h-8 object-contain">
                </div>
            </a>
            <h1 class="text-3xl font-extrabold text-qv-text tracking-tight transition-colors-all">Witaj z powrotem</h1>
            <p class="text-sm text-qv-muted mt-2 transition-colors-all">Wprowadź swoje dane, by uzyskać dostęp do API.</p>
        </div>

        <div class="bg-qv-surface border border-qv-border rounded-2xl shadow-qv-lg p-8 transition-colors-all relative overflow-hidden">

            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-qv-accent"></div>

            <div th:if="${param.error}" class="mb-6 p-4 bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 text-red-700 dark:text-red-400 text-sm rounded-lg transition-colors-all flex items-start">
                <svg class="w-5 h-5 mr-3 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>Nieprawidłowy login lub hasło.</span>
            </div>

            <div th:if="${param.logout}" class="mb-6 p-4 bg-green-50 dark:bg-green-950/30 border border-green-100 dark:border-green-900 text-green-700 dark:text-green-400 text-sm rounded-lg transition-colors-all flex items-start">
                <svg class="w-5 h-5 mr-3 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>Zostałeś poprawnie wylogowany.</span>
            </div>

            <form th:action="@{/login}" method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-qv-text mb-1.5 transition-colors-all">Identyfikator (Username)</label>
                    <input name="username" type="text" required autofocus
                           class="w-full bg-qv-surface-2 border border-qv-border rounded-lg px-4 py-3 text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none transition-all placeholder-qv-muted"
                           placeholder="Wprowadź swój login" />
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-sm font-semibold text-qv-text transition-colors-all">Hasło</label>
                    </div>
                    <input name="password" type="password" required
                           class="w-full bg-qv-surface-2 border border-qv-border rounded-lg px-4 py-3 text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none transition-all placeholder-qv-muted"
                           placeholder="••••••••" />
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-qv-accent hover:bg-qv-accent-hover text-white font-bold rounded-lg shadow-qv hover:shadow-qv-lg transition-all transform hover:-translate-y-0.5 mt-6 relative overflow-hidden group">
                    <span class="relative z-10">Rozpocznij sesję</span>
                    <div class="absolute inset-0 bg-white/20 transform -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-qv-border text-center text-sm text-qv-muted transition-colors-all">
                Nie masz jeszcze konta? <a href="/register" class="text-qv-accent font-semibold hover:underline">Zarejestruj się</a>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="/" class="text-sm font-medium text-qv-muted hover:text-qv-text transition-colors flex items-center justify-center">
                <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                Powrót na stronę główną
            </a>
        </div>
    </div>

</body>
</html>
