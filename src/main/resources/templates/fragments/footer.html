<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<footer th:fragment="footer" class="relative w-full bg-gradient-to-br from-indigo-950 via-violet-950 to-slate-950 py-14 mt-auto overflow-hidden">
    <div class="absolute inset-0 pointer-events-none opacity-30">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-indigo-500 rounded-full mix-blend-screen filter blur-3xl"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-violet-500 rounded-full mix-blend-screen filter blur-3xl"></div>
    </div>

    <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-10">
            <div class="md:col-span-2 space-y-3">
                <div class="flex items-center gap-2.5">
                    <img src="/images/logo.png" alt="Capitall" class="w-8 h-8 object-contain">
                    <span class="text-lg font-bold text-white tracking-tight">Capitall</span>
                </div>
                <p class="text-sm text-slate-400 max-w-md">
                    Profesjonalna platforma do zarządzania kapitałem kryptowalutowym — bezpieczna, przejrzysta, wydajna.
                </p>
            </div>
            <div>
                <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-300 mb-3">Produkt</h4>
                <ul class="space-y-2 text-sm">
                    <li><a href="/dashboard" class="text-slate-400 hover:text-white transition-colors">Panel</a></li>
                    <li><a href="/market" class="text-slate-400 hover:text-white transition-colors">Rynek</a></li>
                    <li><a href="/assets" class="text-slate-400 hover:text-white transition-colors">Aktywa</a></li>
                </ul>
            </div>
            <div>
                <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-300 mb-3">Konto</h4>
                <ul class="space-y-2 text-sm">
                    <li><a href="/login" class="text-slate-400 hover:text-white transition-colors">Zaloguj się</a></li>
                    <li><a href="/register" class="text-slate-400 hover:text-white transition-colors">Zarejestruj się</a></li>
                    <li><a href="/settings" class="text-slate-400 hover:text-white transition-colors">Ustawienia</a></li>
                </ul>
            </div>
        </div>
        <div class="pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
            <span>&copy; 2026 Capitall. Wszelkie prawa zastrzeżone.</span>
            <span>Zbudowane z pasją do bezpiecznych finansów.</span>
        </div>
    </div>
</footer>

</body>
</html>
