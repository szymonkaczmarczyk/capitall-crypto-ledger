<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
    Top public navigation used on marketing / auth pages.
    Param `active` may be one of: home, login, register (or null).
-->
<nav th:fragment="topnav(active)"
     class="bg-qv-surface/80 backdrop-blur border-b border-qv-border py-3 transition-colors-all sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2.5 group">
            <img src="/images/logo.png" alt="Capitall" class="w-9 h-9 object-contain">
            <span class="text-lg font-bold text-qv-text tracking-tight group-hover:text-qv-accent transition-colors">Capitall</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-4">
            <div th:replace="~{fragments/theme :: toggle}"></div>
            <div sec:authorize="!isAuthenticated()" class="flex items-center gap-2 sm:gap-3">
                <a href="/register"
                   th:classappend="${active == 'register' ? 'text-qv-accent' : 'text-qv-text hover:text-qv-accent'}"
                   class="text-sm font-semibold transition-colors px-2 py-1.5">Utwórz konto</a>
                <a href="/login"
                   class="px-4 py-2 bg-qv-accent hover:bg-qv-accent-hover text-white text-sm font-semibold rounded-lg shadow-sm transition-colors">
                    Zaloguj się
                </a>
            </div>
            <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
                <a href="/dashboard"
                   class="px-4 py-2 bg-qv-accent hover:bg-qv-accent-hover text-white text-sm font-semibold rounded-lg shadow-sm transition-colors">
                    Panel
                </a>
            </div>
        </div>
    </div>
</nav>

<!--
    Sidebar navigation for authenticated app pages.
    Param `active` is one of: dashboard, market, allocations, assets, users, tools, settings, admin.
-->
<aside th:fragment="sidebar(active)"
       class="w-64 bg-qv-surface border-r border-qv-border flex-col hidden md:flex transition-colors-all sidebar-glow">
    <div class="h-16 flex items-center px-6 border-b border-qv-border">
        <a href="/dashboard" class="flex items-center gap-2.5 group">
            <img src="/images/logo.png" alt="Logo" class="w-7 h-7 object-contain">
            <span class="font-bold text-lg text-qv-text group-hover:text-qv-accent transition-colors">Capitall</span>
        </a>
    </div>

    <nav class="flex-1 px-3 pt-3 pb-4 space-y-1 overflow-y-auto">
        <div class="nav-section-label">Przegląd</div>
        <a href="/dashboard" style="--tile: 99 102 241;"
           th:classappend="${active == 'dashboard' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z"/></svg></span>
            Dashboard
        </a>
        <a href="/market" style="--tile: 16 185 129;"
           th:classappend="${active == 'market' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v18h18M7 14l4-4 4 4 6-6"/></svg></span>
            Rynek
            <span class="ml-auto text-[10px] font-bold bg-emerald-500 text-white px-1.5 py-0.5 rounded-full neon-badge-live shadow-lg shadow-emerald-500/40">LIVE</span>
        </a>

        <div class="nav-section-label">Portfel</div>
        <a sec:authorize="hasRole('ADMIN')" href="/allocations" style="--tile: 139 92 246;"
           th:classappend="${active == 'allocations' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg></span>
            Alokacje
        </a>
        <a href="/assets" style="--tile: 245 158 11;"
           th:classappend="${active == 'assets' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V6m0 10v2m6-6a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></span>
            Aktywa
        </a>

        <div class="nav-section-label">Handel</div>
        <a href="/exchange" style="--tile: 6 182 212;"
           th:classappend="${active == 'exchange' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg></span>
            Giełda
        </a>
        <a href="/securities" style="--tile: 14 165 233;"
           th:classappend="${active == 'securities' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></span>
            Papiery
        </a>

        <div class="nav-section-label">Monitoring</div>
        <a href="/alerts" style="--tile: 244 63 94;"
           th:classappend="${active == 'alerts' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg></span>
            Alerty
        </a>
        <a href="/tools" style="--tile: 20 184 166;"
           th:classappend="${active == 'tools' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></span>
            Narzędzia
        </a>

        <div class="nav-section-label">System</div>
        <a href="/settings" style="--tile: 100 116 139;"
           th:classappend="${active == 'settings' ? 'is-active bg-qv-surface-2 text-qv-text font-semibold' : 'text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></span>
            Ustawienia
        </a>
        <a sec:authorize="hasRole('ADMIN')" href="/admin" style="--tile: 239 68 68;"
           th:classappend="${active == 'admin' ? 'is-active bg-red-50 dark:bg-red-950/20 text-red-500 font-semibold' : 'text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/20 font-medium'}"
           class="nav-item group flex items-center px-3 py-2 rounded-lg transition-colors-all">
            <span class="nav-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg></span>
            Administracja
        </a>
    </nav>

    <div class="p-3 border-t border-qv-border">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="flex w-full items-center px-3 py-2 text-qv-muted hover:text-qv-text hover:bg-qv-surface-2 font-medium rounded-lg transition-colors-all">
                <svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Wyloguj się
            </button>
        </form>
    </div>
</aside>

<!--
    Mobile bottom bar (visible only below md). Param `active` matches sidebar.
-->
<div th:fragment="mobilebar(active)"
     class="md:hidden fixed bottom-0 left-0 right-0 bg-qv-surface/95 backdrop-blur border-t border-qv-border z-50 flex justify-around py-2 px-2 shadow-qv-lg">
    <a href="/dashboard" class="flex flex-col items-center py-1 px-3 rounded-lg transition-colors"
       th:classappend="${active == 'dashboard' ? 'text-qv-accent' : 'text-qv-muted hover:text-qv-text'}">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span class="text-[10px] font-medium mt-1">Panel</span>
    </a>
    <a href="/market" class="flex flex-col items-center py-1 px-3 rounded-lg transition-colors"
       th:classappend="${active == 'market' ? 'text-qv-accent' : 'text-qv-muted hover:text-qv-text'}">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v18h18M7 14l4-4 4 4 6-6"/></svg>
        <span class="text-[10px] font-medium mt-1">Rynek</span>
    </a>
    <a href="/exchange" class="flex flex-col items-center py-1 px-3 rounded-lg transition-colors"
       th:classappend="${active == 'exchange' ? 'text-qv-accent' : 'text-qv-muted hover:text-qv-text'}">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        <span class="text-[10px] font-medium mt-1">Giełda</span>
    </a>
    <a href="/assets" class="flex flex-col items-center py-1 px-3 rounded-lg transition-colors"
       th:classappend="${active == 'assets' ? 'text-qv-accent' : 'text-qv-muted hover:text-qv-text'}">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] font-medium mt-1">Aktywa</span>
    </a>
    <a href="/settings" class="flex flex-col items-center py-1 px-3 rounded-lg transition-colors"
       th:classappend="${active == 'settings' ? 'text-qv-accent' : 'text-qv-muted hover:text-qv-text'}">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        <span class="text-[10px] font-medium mt-1">Więcej</span>
    </a>
</div>

<!--
    Compact top-header used inside authenticated pages (title + right actions slot).
    Use with a body: <header th:replace="~{fragments/nav :: topbar('Title')}"></header> — but we keep header inline in each page for flexibility.
    This fragment provides ONLY the theme toggle button used within page headers.
-->

</body>
</html>
