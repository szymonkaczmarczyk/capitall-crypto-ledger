<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Aktywa')}"></head>
<body class="bg-qv-bg font-sans text-qv-text antialiased h-screen flex overflow-hidden transition-colors-all">

    <aside th:replace="~{fragments/nav :: sidebar('assets')}"></aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-qv-surface border-b border-qv-border flex items-center justify-between px-6 lg:px-8 transition-colors-all">
            <h2 class="text-lg font-bold text-qv-text transition-colors-all">Zarządzanie aktywami</h2>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/theme :: toggle}"></div>
                <a sec:authorize="hasRole('ADMIN')" href="/assets/new" class="inline-flex items-center px-4 py-2 bg-qv-accent hover:bg-qv-accent-hover text-white text-sm font-semibold rounded-md shadow-qv transition-colors">
                    + Nowe konto
                </a>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 lg:p-8">

            <div class="bg-qv-surface border border-qv-border rounded-xl shadow-qv p-4 mb-6">
                <form th:action="@{/assets}" method="get" class="flex flex-col sm:flex-row gap-4 items-end">
                    <div class="w-full sm:w-auto flex-1">
                        <label class="block text-xs font-semibold text-qv-muted mb-1.5 uppercase">Giełda</label>
                        <select name="exchange" class="w-full h-10 bg-qv-surface-2 border border-qv-border rounded-md px-3 text-sm text-qv-text focus:ring-1 focus:ring-qv-accent focus:border-qv-accent focus:outline-none">
                            <option value="">Wszystkie giełdy</option>
                            <option value="BINANCE" th:selected="${exchange == 'BINANCE'}">Binance</option>
                            <option value="KRAKEN" th:selected="${exchange == 'KRAKEN'}">Kraken</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-auto flex-1 relative">
                        <label class="block text-xs font-semibold text-qv-muted mb-1.5 uppercase">Min. Kapitał</label>
                        <span class="absolute left-3 top-8 text-sm font-medium text-qv-muted">$</span>
                        <input type="number" step="0.01" name="minCapital" th:value="${minCapital}" class="w-full h-10 bg-qv-surface-2 border border-qv-border rounded-md pl-7 pr-3 text-sm text-qv-text focus:ring-1 focus:ring-qv-accent focus:border-qv-accent focus:outline-none" placeholder="0.00" />
                    </div>
                    <div class="w-full sm:w-auto flex-1">
                        <label class="block text-xs font-semibold text-qv-muted mb-1.5 uppercase">Status</label>
                        <select name="active" class="w-full h-10 bg-qv-surface-2 border border-qv-border rounded-md px-3 text-sm text-qv-text focus:ring-1 focus:ring-qv-accent focus:border-qv-accent focus:outline-none">
                            <option value="">Wszystkie statusy</option>
                            <option value="true" th:selected="${active != null and active}">Online</option>
                            <option value="false" th:selected="${active != null and !active}">Offline</option>
                        </select>
                    </div>
                    <button type="submit" class="h-10 px-5 bg-qv-surface-2 border border-qv-border text-qv-text text-sm font-semibold rounded-md hover:border-qv-accent hover:text-qv-accent transition-colors">
                        Filtruj
                    </button>
                </form>
            </div>

            <div class="bg-qv-surface border border-qv-border rounded-xl shadow-qv overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-qv-surface-2 border-b border-qv-border">
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider">Konto giełdowe</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider">Kapitał dostępny</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider">Status połączenia</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider">Dodano</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider text-right">Akcje</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-qv-border">
                            <tr th:each="asset : ${assets}" class="hover:bg-qv-surface-2/60 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="text-sm font-semibold text-qv-text" th:text="${asset.accountName}">SubKonto 1</div>
                                    <div class="text-xs text-qv-muted" th:text="${asset.exchangeName}">BINANCE</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-sm font-semibold text-qv-text" th:text="${'$' + #numbers.formatDecimal(asset.allocatedCapital, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center">
                                        <div class="w-2 h-2 rounded-full mr-2" th:classappend="${asset.isActive ? 'bg-green-500' : 'bg-red-500'}"></div>
                                        <span class="text-xs font-medium" th:classappend="${asset.isActive ? 'text-green-700 dark:text-green-400' : 'text-red-700 dark:text-red-400'}" th:text="${asset.isActive ? 'Online (Połączono)' : 'Offline (Błąd)'}">Online</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-xs font-medium text-qv-muted">
                                    <span th:text="${#temporals.format(asset.createdAt, 'dd-MM-yyyy')}">01-01-2026</span>
                                </td>
                                <td class="px-6 py-4 text-right space-x-3">
                                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/assets/edit/{id}(id=${asset.id})}" class="text-xs font-semibold text-qv-accent hover:underline">Edytuj</a>
                                </td>
                            </tr>
                            <tr th:if="${assets.isEmpty()}">
                                <td colspan="5" class="px-6 py-12 text-center">
                                    <p class="text-sm text-qv-muted mb-4">Nie znaleziono żadnych kont spełniających kryteria.</p>
                                    <a sec:authorize="hasRole('ADMIN')" href="/assets/new" class="inline-flex items-center px-4 py-2 bg-qv-surface-2 border border-qv-border text-qv-text text-sm font-semibold rounded-md hover:border-qv-accent hover:text-qv-accent transition-colors shadow-sm">
                                        Dodaj pierwsze konto
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/nav :: mobilebar('assets')}"></div>

</body>
</html>
