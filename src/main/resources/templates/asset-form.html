<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitall - Formularz aktywa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        qv: {
                            bg: 'var(--qv-bg)',
                            surface: 'var(--qv-surface)',
                            border: 'var(--qv-border)',
                            text: 'var(--qv-text)',
                            muted: 'var(--qv-muted)',
                            accent: 'var(--qv-accent)'
                        }
                    },
                    boxShadow: { 'qv': '0 1px 3px 0 rgb(0 0 0 / 0.1)', 'qv-lg': '0 10px 15px -3px rgb(0 0 0 / 0.05)' }
                }
            }
        }
    </script>
    <style>
        :root {
            --qv-bg: #e7ecf3;
            --qv-surface: #ffffff;
            --qv-border: #94a3b8;
            --qv-text: #0a0f1e;
            --qv-muted: #334155;
            --qv-accent: #5b21b6;
        }
        .dark {
            --qv-bg: #0b1120;
            --qv-surface: #1e293b;
            --qv-border: #334155;
            --qv-text: #f8fafc;
            --qv-muted: #94a3b8;
            --qv-accent: #8b5cf6;
        }
        body {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .transition-colors-all {
            transition-property: background-color, border-color, color, fill, stroke, box-shadow;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 400ms;
        }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
    </script>
</head>
<body class="bg-qv-bg font-sans text-qv-text antialiased h-screen flex overflow-hidden transition-colors-all">

    <aside class="w-64 bg-qv-surface border-r border-qv-border flex flex-col hidden md:flex transition-colors-all">
        <div class="h-16 flex items-center px-6 border-b border-qv-border">
            <img src="/images/logo.png" alt="Logo" class="w-6 h-6 mr-3 object-contain">
            <span class="font-bold text-lg text-qv-text transition-colors-all">Capitall</span>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="/dashboard" class="flex items-center px-3 py-2 text-qv-muted hover:text-qv-text hover:bg-qv-bg font-medium rounded-md transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z" /></svg>
                Dashboard
            </a>
            <a sec:authorize="hasRole('ADMIN')" href="/allocations" class="flex items-center px-3 py-2 text-qv-muted hover:text-qv-text hover:bg-qv-bg font-medium rounded-md transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>
                Alokacje
            </a>
            <a href="/assets" class="flex items-center px-3 py-2 bg-qv-bg text-qv-text font-semibold rounded-md transition-all">
                <svg class="w-5 h-5 mr-3 text-qv-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1" /></svg>
                Aktywa
            </a>
            <a href="/tools" class="flex items-center px-3 py-2 text-qv-muted hover:text-qv-text hover:bg-qv-bg font-medium rounded-md transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
                Narzędzia
            </a>
            <a href="/settings" class="flex items-center px-3 py-2 text-qv-muted hover:text-qv-text hover:bg-qv-bg font-medium rounded-md transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>
                Ustawienia
            </a>
            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/admin" class="flex items-center px-3 py-2 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-950/20 font-medium rounded-md transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                Administracja
            </a>
        </nav>
        <div class="p-4 border-t border-qv-border">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="flex w-full items-center px-3 py-2 text-qv-muted hover:text-qv-text hover:bg-qv-bg font-medium rounded-md transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    Wyloguj się
                </button>
            </form>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 bg-qv-surface border-b border-qv-border flex items-center justify-between px-6 lg:px-8 transition-colors-all">
            <h2 class="text-lg font-bold text-qv-text transition-colors-all" th:text="${isEdit} ? 'Edytuj Konto giełdowe' : 'Nowe konto giełdowe'">Konto giełdowe</h2>
            <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="Przełącz motyw">
                <svg class="w-5 h-5 text-qv-muted hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                <svg class="w-5 h-5 text-qv-muted block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </button>
        </header>

        <div class="flex-1 p-6 lg:p-8 max-w-3xl w-full mx-auto">
            <a href="/assets" class="inline-flex items-center text-sm font-medium text-qv-muted hover:text-qv-accent transition-colors mb-6">
                &larr; Powrót do listy aktywów
            </a>

            <div class="bg-qv-surface border border-qv-border rounded-xl shadow-qv-lg p-8">
                <form th:action="${isEdit} ? @{/assets/edit/{id}(id=${accountId})} : @{/assets/new}" 
                      th:object="${exchangeAccountForm}" method="POST" class="space-y-5">

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Giełda Docelowa</label>
                        <select th:field="*{exchangeName}" required
                                class="w-full bg-qv-surface border border-qv-border rounded-md px-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                                th:classappend="${#fields.hasErrors('exchangeName') ? 'border-red-400' : ''}">
                            <option value="" disabled selected>-- Wybierz Obsługiwaną Giełdę --</option>
                            <option value="BINANCE">Binance</option>
                            <option value="KRAKEN">Kraken</option>
                        </select>
                        <p th:if="${#fields.hasErrors('exchangeName')}" th:errors="*{exchangeName}" class="text-xs text-red-600 mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Nazwa Własna Konta</label>
                        <input type="text" th:field="*{accountName}" required placeholder="Np. Główny Portfel Spot"
                               class="w-full bg-qv-surface border border-qv-border rounded-md px-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                               th:classappend="${#fields.hasErrors('accountName') ? 'border-red-400' : ''}" />
                        <p th:if="${#fields.hasErrors('accountName')}" th:errors="*{accountName}" class="text-xs text-red-600 mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Klucz API (Publiczny)</label>
                        <input type="password" th:field="*{apiKey}" required
                               class="w-full bg-qv-surface border border-qv-border rounded-md px-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                               th:classappend="${#fields.hasErrors('apiKey') ? 'border-red-400' : ''}" />
                        <p th:if="${#fields.hasErrors('apiKey')}" th:errors="*{apiKey}" class="text-xs text-red-600 mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Sekret API (Prywatny)</label>
                        <input type="password" th:field="*{apiSecret}" required
                               class="w-full bg-qv-surface border border-qv-border rounded-md px-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                               th:classappend="${#fields.hasErrors('apiSecret') ? 'border-red-400' : ''}" />
                        <p th:if="${#fields.hasErrors('apiSecret')}" th:errors="*{apiSecret}" class="text-xs text-red-600 mt-1"></p>
                        <p class="text-xs text-qv-muted mt-1">Klucze są szyfrowane militarnym algorytmem AES-GCM-256 przed umieszczeniem w bazie.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Zadeklarowany Kapitał Początkowy</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-sm text-qv-muted">$</span>
                            <input type="number" step="0.01" th:field="*{allocatedCapital}" required
                                   class="w-full bg-qv-surface border border-qv-border rounded-md pl-7 pr-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                                   th:classappend="${#fields.hasErrors('allocatedCapital') ? 'border-red-400' : ''}" />
                        </div>
                        <p th:if="${#fields.hasErrors('allocatedCapital')}" th:errors="*{allocatedCapital}" class="text-xs text-red-600 mt-1"></p>
                    </div>

                    <div class="pt-4 flex items-center justify-end space-x-4 border-t border-qv-border">
                        <a href="/assets" class="text-sm font-medium text-qv-muted hover:text-qv-text">Anuluj</a>
                        <button type="submit" class="px-5 py-2.5 bg-qv-accent text-white text-sm font-semibold rounded-md shadow-qv hover:opacity-90 transition-opacity">
                            Zapisz Konto giełdowe
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-qv-surface border-t border-qv-border z-50 flex justify-around py-3 px-2 shadow-qv">
        <a href="/dashboard" class="flex flex-col items-center text-qv-muted hover:text-qv-text">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
            <span class="text-[10px] font-medium mt-1">Panel</span>
        </a>
        <a sec:authorize="hasRole('ADMIN')" href="/allocations" class="flex flex-col items-center text-qv-muted hover:text-qv-text">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>
            <span class="text-[10px] font-medium mt-1">Alokacje</span>
        </a>
        <a href="/assets" class="flex flex-col items-center text-qv-accent">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <span class="text-[10px] font-medium mt-1">Aktywa</span>
        </a>
    </div>

</body>
</html>
