<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Narzędzia inwestorskie')}"></head>
<body class="bg-qv-bg font-sans text-qv-text antialiased h-screen flex overflow-hidden transition-colors-all">

    <aside th:replace="~{fragments/nav :: sidebar('tools')}"></aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 bg-qv-surface border-b border-qv-border flex items-center justify-between px-6 lg:px-8 transition-colors-all">
            <h2 class="text-lg font-bold text-qv-text transition-colors-all">Narzędzia inwestorskie</h2>
            <div th:replace="~{fragments/theme :: toggle}"></div>
        </header>

        <div class="p-6 lg:p-8 space-y-8 max-w-7xl w-full mx-auto">

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">


                <div class="bg-qv-surface border border-qv-border rounded-xl p-6 shadow-qv transition-colors-all flex flex-col justify-between">
                    <div>
                        <h3 class="text-md font-bold text-qv-text mb-2">API Connection Tester</h3>
                        <p class="text-xs text-qv-muted mb-4">Przetestuj autoryzację i czas odpowiedzi (Ping) z podpiętymi giełdami.</p>
                    </div>

                    <div class="space-y-4">
                        <button onclick="testApi()" id="testApiBtn" class="w-full py-2 bg-qv-surface-2 border border-qv-border text-qv-text font-semibold text-sm rounded-md hover:border-qv-accent hover:text-qv-accent transition-colors">
                            Uruchom Test Połączenia
                        </button>

                        <div id="apiTestResult" class="hidden p-3 rounded-lg text-xs font-medium text-center">
                            Ping: 0ms
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-qv-surface border border-qv-border rounded-xl shadow-qv transition-colors-all overflow-hidden">
                <div class="px-6 py-4 border-b border-qv-border">
                    <h3 class="text-md font-bold text-qv-text">Dziennik Aktywności (Audit Logs)</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-qv-surface-2 text-qv-muted text-[10px] font-bold uppercase tracking-wider transition-colors-all">
                                <th class="py-3 px-6">Czas</th>
                                <th class="py-3 px-6">Akcja</th>
                                <th class="py-3 px-6">Adres IP</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-qv-border text-xs text-qv-text transition-colors-all">
                            <tr th:each="log : ${logs}">
                                <td class="py-4 px-6 text-qv-muted" th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-06-15 12:00:00</td>
                                <td class="py-4 px-6 font-semibold" th:text="${log.action}">Zalogowano pomyślnie</td>
                                <td class="py-4 px-6 text-qv-muted" th:text="${log.ipAddress}">127.0.0.1</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="3" class="py-6 text-center text-qv-muted">Brak zarejestrowanych działań.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/nav :: mobilebar('tools')}"></div>

    <script>
        const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
        const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';
        const csrfInit = (extra) => ({ method: 'POST', credentials: 'same-origin', headers: Object.assign({ [CSRF_HEADER]: CSRF_TOKEN }, extra || {}) });



        function testApi() {
            const btn = document.getElementById('testApiBtn');
            const resBox = document.getElementById('apiTestResult');
            btn.disabled = true;
            btn.innerText = 'Testowanie...';

            fetch('/tools/test-api', csrfInit())
                .then(res => res.json())
                .then(data => {
                    resBox.innerText = data.message;
                    resBox.className = 'p-3 rounded-lg text-xs font-semibold text-center bg-green-50 text-green-700 dark:bg-green-950/20 dark:text-green-400';
                    resBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerText = 'Uruchom Test Połączenia';
                })
                .catch(() => {
                    resBox.innerText = 'Błąd komunikacji z giełdą.';
                    resBox.className = 'p-3 rounded-lg text-xs font-semibold text-center bg-red-50 text-red-700 dark:bg-red-950/20 dark:text-red-400';
                    resBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerText = 'Uruchom Test Połączenia';
                });
        }
</script>

</body>
</html>
