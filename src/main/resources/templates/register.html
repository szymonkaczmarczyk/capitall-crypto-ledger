<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Rejestracja')}"></head>
<body class="bg-qv-bg font-sans text-qv-text antialiased min-h-screen flex flex-col justify-center items-center relative overflow-hidden">

    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-qv-accent/10 dark:bg-qv-accent/20 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[100px] opacity-70 animate-pulse transition-colors-all"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-300/10 dark:bg-blue-600/20 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[100px] opacity-70 transition-colors-all"></div>

    <div class="absolute top-6 right-6 z-50">
        <div th:replace="~{fragments/theme :: toggle}"></div>
    </div>

    <div class="w-full max-w-md bg-qv-surface/90 backdrop-blur-xl border border-qv-border rounded-2xl shadow-qv-lg p-10 relative z-10 transition-colors-all transform hover:scale-[1.01] duration-300">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-qv-accent to-blue-400 p-0.5 mx-auto mb-5 shadow-sm">
                <div class="w-full h-full bg-qv-surface rounded-2xl flex items-center justify-center transition-colors-all">
                    <img src="/images/logo.png" alt="Logo" class="w-7 h-7 object-contain">
                </div>
            </div>
            <h2 class="text-3xl font-bold text-qv-text tracking-tight transition-colors-all">Rejestracja</h2>
            <p class="text-sm text-qv-muted mt-2 transition-colors-all">Załóż nowe konto inwestycyjne.</p>
        </div>

        <div th:if="${error}" class="mb-5 p-4 bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 text-red-700 dark:text-red-400 text-sm font-medium rounded-lg transition-colors-all text-center">
            <span th:text="${error}">Wystąpił błąd podczas rejestracji.</span>
        </div>

        <form th:action="@{/register}" th:object="${registerForm}" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-qv-text mb-1.5 transition-colors-all">Identyfikator (Username)</label>
                <input th:field="*{username}" type="text" required
                       class="w-full bg-qv-surface-2 border border-qv-border rounded-lg px-4 py-3 text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none transition-all shadow-sm"
                       placeholder="np. john_doe" />
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-xs text-red-500 mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-qv-text mb-1.5 transition-colors-all">Adres E-mail</label>
                <input th:field="*{email}" type="email" required
                       class="w-full bg-qv-surface-2 border border-qv-border rounded-lg px-4 py-3 text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none transition-all shadow-sm"
                       placeholder="john@example.com" />
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-red-500 mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-qv-text mb-1.5 transition-colors-all">Numer telefonu</label>
                <input th:field="*{phoneNumber}" type="tel" required
                       class="w-full bg-qv-surface-2 border border-qv-border rounded-lg px-4 py-3 text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none transition-all shadow-sm"
                       placeholder="+48 600 000 000" />
                <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-xs text-red-500 mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-qv-text mb-1.5 transition-colors-all">Zabezpieczenie konta (Hasło)</label>
                <input th:field="*{password}" type="password" required
                       class="w-full bg-qv-surface-2 border border-qv-border rounded-lg px-4 py-3 text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none transition-all shadow-sm"
                       placeholder="Min. 12 znaków, A-Z, a-z, 0-9, znak specjalny" />
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-red-500 mt-1"></p>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-qv-accent to-blue-500 text-white font-bold rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 mt-6 border border-white/10">
                Utwórz profil
            </button>
        </form>

        <div class="mt-8 text-center text-sm font-medium text-qv-muted transition-colors-all">
            Masz już konto? <a href="/login" class="text-qv-accent hover:underline">Zaloguj się</a>
        </div>
    </div>

</body>
</html>
