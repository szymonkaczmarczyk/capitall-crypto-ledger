<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Nowa alokacja')}"></head>
<body class="bg-qv-bg font-sans text-qv-text antialiased h-screen flex overflow-hidden transition-colors-all">

    <aside th:replace="~{fragments/nav :: sidebar('allocations')}"></aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 bg-qv-surface border-b border-qv-border flex items-center justify-between px-6 lg:px-8 transition-colors-all">
            <h2 class="text-lg font-bold text-qv-text transition-colors-all">Kreator Alokacji Kapitałowej</h2>
            <div th:replace="~{fragments/theme :: toggle}"></div>
        </header>

        <div class="flex-1 p-6 lg:p-8 max-w-3xl w-full mx-auto">
            <a sec:authorize="hasRole('ADMIN')" href="/allocations" class="inline-flex items-center text-sm font-medium text-qv-muted hover:text-qv-accent transition-colors mb-6">
                &larr; Powrót do listy alokacji
            </a>

            <div class="bg-qv-surface border border-qv-border rounded-xl shadow-qv-lg p-8">
                <form th:action="@{/allocations/new}" th:object="${allocationForm}" method="POST" class="space-y-5">

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Trader/Podmiot</label>
                        <select th:field="*{userId}" required
                                class="w-full bg-qv-surface-2 border border-qv-border rounded-md px-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                                th:classappend="${#fields.hasErrors('userId') ? 'border-red-400' : ''}">
                            <option value="" disabled selected>-- Wybierz Autoryzowanego Użytkownika --</option>
                            <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username + ' (' + user.role + ')'}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="text-xs text-red-600 mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Wolne Konto giełdowe</label>
                        <select th:field="*{exchangeAccountId}" required
                                class="w-full bg-qv-surface-2 border border-qv-border rounded-md px-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                                th:classappend="${#fields.hasErrors('exchangeAccountId') ? 'border-red-400' : ''}">
                            <option value="" disabled selected>-- Dostępne Aktywa w Systemie --</option>
                            <option th:each="asset : ${assets}" th:if="${asset.isActive}" th:value="${asset.id}" th:text="${asset.exchangeName + ' - ' + asset.accountName + ' ($' + asset.allocatedCapital + ')'}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('exchangeAccountId')}" th:errors="*{exchangeAccountId}" class="text-xs text-red-600 mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-qv-text mb-1">Data Wygasania Alokacji (Opcjonalnie)</label>
                        <input type="datetime-local" th:field="*{expiresAt}"
                               class="w-full bg-qv-surface-2 border border-qv-border rounded-md px-3 py-2.5 text-sm text-qv-text focus:ring-2 focus:ring-qv-accent focus:border-qv-accent focus:outline-none"
                               th:classappend="${#fields.hasErrors('expiresAt') ? 'border-red-400' : ''}" />
                        <p th:if="${#fields.hasErrors('expiresAt')}" th:errors="*{expiresAt}" class="text-xs text-red-600 mt-1"></p>
                        <p class="text-xs text-qv-muted mt-1">Zostaw puste pole, jeśli mandat ma być bezterminowy.</p>
                    </div>

                    <div class="pt-4 flex items-center justify-end space-x-4 border-t border-qv-border">
                        <a sec:authorize="hasRole('ADMIN')" href="/allocations" class="text-sm font-medium text-qv-muted hover:text-qv-text">Anuluj</a>
                        <button type="submit" class="px-5 py-2.5 bg-qv-accent hover:bg-qv-accent-hover text-white text-sm font-semibold rounded-md shadow-qv transition-colors">
                            Zatwierdź Alokację
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/nav :: mobilebar('allocations')}"></div>

</body>
</html>
