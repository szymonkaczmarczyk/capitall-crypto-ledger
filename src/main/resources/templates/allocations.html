<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pl">
<head th:replace="~{fragments/head :: head('Capitall - Alokacje')}"></head>
<body class="bg-qv-bg font-sans text-qv-text antialiased h-screen flex overflow-hidden transition-colors-all">

    <aside th:replace="~{fragments/nav :: sidebar('allocations')}"></aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-qv-surface border-b border-qv-border flex items-center justify-between px-6 lg:px-8 transition-colors-all">
            <h2 class="text-lg font-bold text-qv-text transition-colors-all">Zarządzanie alokacjami</h2>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/theme :: toggle}"></div>
                <a href="/allocations/new" class="inline-flex items-center px-4 py-2 bg-qv-accent hover:bg-qv-accent-hover text-white text-sm font-semibold rounded-md shadow-qv transition-colors">
                    + Przypisz konto
                </a>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 lg:p-8">

            <div class="bg-qv-surface border border-qv-border rounded-xl shadow-qv overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-qv-surface-2 border-b border-qv-border">
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider">Użytkownik</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider">Zasób</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider">Kapitał</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider text-center">Status</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider text-right">Ważność do</th>
                                <th class="px-6 py-3 text-xs font-semibold text-qv-muted uppercase tracking-wider text-center">Akcje</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-qv-border">
                            <tr th:each="allocation : ${allocations}" class="hover:bg-qv-surface-2/60 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="text-sm font-semibold text-qv-text" th:text="${allocation.username}">Nazwa</div>
                                    <div class="text-xs text-qv-muted" th:text="${allocation.userRole}">TRADER</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-sm font-semibold text-qv-text" th:text="${allocation.accountName}">Konto Binance</div>
                                    <div class="text-xs text-qv-muted" th:text="${allocation.exchangeName}">BINANCE</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-sm font-semibold text-qv-text" th:text="${'$' + #numbers.formatDecimal(allocation.allocatedCapital, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold border"
                                          th:classappend="${allocation.status.name() == 'ACTIVE' ? 'bg-green-50 text-green-700 border-green-200 dark:bg-green-950/30 dark:text-green-400 dark:border-green-900' : 'bg-qv-surface-2 text-qv-muted border-qv-border'}">
                                        <span class="w-1.5 h-1.5 rounded-full mr-1.5" th:classappend="${allocation.status.name() == 'ACTIVE' ? 'bg-green-500' : 'bg-slate-400'}"></span>
                                        <span th:text="${allocation.status}">ACTIVE</span>
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-right text-xs font-medium text-qv-muted">
                                    <span th:text="${#temporals.format(allocation.expiresAt, 'dd-MM-yyyy HH:mm')}">31-12-2026</span>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <form th:if="${allocation.status.name() == 'ACTIVE'}" method="POST" th:action="@{/allocations/{id}/expire(id=${allocation.id})}" onsubmit="return confirm('Czy na pewno chcesz zakończyć alokację?');">
                                        <button type="submit" class="text-xs font-semibold text-red-600 hover:text-red-800 hover:underline">Zakończ</button>
                                    </form>
                                    <span th:if="${allocation.status.name() != 'ACTIVE'}" class="text-xs text-qv-muted">-</span>
                                </td>
                            </tr>
                            <tr th:if="${allocations.isEmpty()}">
                                <td colspan="6" class="px-6 py-12 text-center">
                                    <p class="text-sm text-qv-muted mb-4">Brak jakichkolwiek powiązań w systemie.</p>
                                    <a href="/allocations/new" class="inline-flex items-center px-4 py-2 bg-qv-surface-2 border border-qv-border text-qv-text text-sm font-semibold rounded-md hover:border-qv-accent hover:text-qv-accent transition-colors shadow-sm">
                                        Utwórz alokację
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/nav :: mobilebar('allocations')}"></div>

</body>
</html>
